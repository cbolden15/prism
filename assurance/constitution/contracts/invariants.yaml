  - id: PNH-INV-08
    title: Success requires complete positive evidence
    category: evidence
    statement: |
      Success requires one valid response, a clean matching exit commitment, truthful out-of-memory state, and confirmed cleanup; an outcome missing any of these must never settle as success.
    law_status: ratified
    proof_status: unproven
    proof_reason: No suite independently removes each required positive-evidence signal and proves that every incomplete combination fails closed.
