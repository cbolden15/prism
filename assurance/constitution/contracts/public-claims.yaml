# Handwritten public-claim manifest.
#
# Every registered block in a public surface binds a claim ID, the sha256
# digest of its deterministically normalized Markdown, the file it lives in,
# its backing invariant IDs, a posture, the execution classes it applies to,
# the environments its evidence comes from, and its release scope.
#
# Postures:
#   supported  — the block asserts behavior the project stands behind. Every
#                backing invariant must be ratified, proven, and non-deferred.
#   planned    — the block describes a mechanism that exists or is intended
#                but whose invariants are not yet proven. No support is claimed.
#   limitation — the block states what the project does not provide, or bounds
#                a mechanism's guarantee.
#   deferred   — the block covers an invariant whose first-release disposition
#                is `defer`. Its text must not present the behavior as available.
#
# Generated constitution blocks are checked by regeneration and are never
# registered here.
