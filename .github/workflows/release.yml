name: Prism OSS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm package version
        required: true
        default: "0.1.0"
        type: string
      tag:
        description: Existing tag pointing at the protected main SHA
        required: true
        default: "v0.1.0"
        type: string

permissions: {}

concurrency:
  group: prism-oss-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.verified-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.verified-artifact.outputs.artifact-digest }}
    steps:
      - name: Check out the complete exact history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate exact release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release/verify-oss-release.mjs
          --root .
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --ref "$GITHUB_REF"
          --source-commit "$GITHUB_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked full dependency graph
        run: npm audit --audit-level=low --include=dev --include=optional --include=peer

      - name: Run full verification
        run: |
          npm test
          npm run pack:check

      - name: Build exact release candidate
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/prism-oss-candidate-0.1.0
        run: node scripts/release/pack-developer-preview.mjs --output "$CANDIDATE_ROOT"

      - name: Generate full dependency SBOM and enforce licenses
        env:
          SBOM_PATH: ${{ runner.temp }}/prism-0.1.0.spdx.json
          LICENSE_REPORT_PATH: ${{ runner.temp }}/prism-0.1.0-licenses.json
          SBOM_NAMESPACE: https://github.com/${{ github.repository }}/releases/tag/v0.1.0#sbom
        run: |
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/release/generate-oss-sbom.mjs \
            --root . \
            --output "$SBOM_PATH" \
            --license-report "$LICENSE_REPORT_PATH" \
            --created "$created" \
            --namespace "$SBOM_NAMESPACE"

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary_root="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$binary_root"
          tar --extract --gzip --file "$archive" --directory "$binary_root" gitleaks
          chmod 0755 "$binary_root/gitleaks"
          "$binary_root/gitleaks" version

      - name: Scan full history and extracted candidate
        run: >-
          node scripts/release/scan-oss-release.mjs
          --repository .
          --candidate "$RUNNER_TEMP/prism-oss-candidate-0.1.0"
          --source-commit "$GITHUB_SHA"
          --gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks"

      - name: Prepare closed verified release artifact
        run: >-
          node scripts/release/prepare-oss-release-bundle.mjs create
          --candidate "$RUNNER_TEMP/prism-oss-candidate-0.1.0"
          --sbom "$RUNNER_TEMP/prism-0.1.0.spdx.json"
          --license-report "$RUNNER_TEMP/prism-0.1.0-licenses.json"
          --output "$RUNNER_TEMP/prism-oss-release-bundle"
          --source-commit "$GITHUB_SHA"

      - name: Upload exact verified release artifact
        id: verified-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prism-oss-0.1.0-${{ github.sha }}
          path: ${{ runner.temp }}/prism-oss-release-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up exact Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download exact verified release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/prism-oss-release-bundle
          merge-multiple: true

      - name: Revalidate downloaded release closure and digests
        env:
          VERIFIED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
        run: |
          [[ "$VERIFIED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          node scripts/release/prepare-oss-release-bundle.mjs verify \
            --bundle "$RUNNER_TEMP/prism-oss-release-bundle" \
            --source-commit "$GITHUB_SHA"

      - name: Attest complete release asset set with build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-sdk-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-runtime-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-provider-ollama-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-cli-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/SHA256SUMS
            ${{ runner.temp }}/prism-oss-release-bundle/prism-0.1.0.spdx.json
            ${{ runner.temp }}/prism-oss-release-bundle/prism-0.1.0-licenses.json

      - name: Attest four package tarballs with release-set SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-sdk-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-runtime-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-provider-ollama-0.1.0.tgz
            ${{ runner.temp }}/prism-oss-release-bundle/candidate/packages/useprism-cli-0.1.0.tgz
          sbom-path: ${{ runner.temp }}/prism-oss-release-bundle/prism-0.1.0.spdx.json

      - name: Publish exact candidate packages to next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release/publish-oss-release.mjs
          --candidate "$RUNNER_TEMP/prism-oss-release-bundle/candidate"
          --source-commit "$GITHUB_SHA"
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --ref "$GITHUB_REF"

      - name: Verify registry integrity, provenance, and installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release/smoke-oss-registry.mjs
          --candidate "$RUNNER_TEMP/prism-oss-release-bundle/candidate"
          --source-commit "$GITHUB_SHA"
          --version "$RELEASE_VERSION"

      - name: Install pinned GitHub CLI
        env:
          GH_CLI_VERSION: "2.99.0"
          GH_CLI_SHA256: "ed4960225d2833e04a61590d9fa2b5773d147f3aa375459e5466a40c102f3832"
        run: |
          archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          binary_root="$RUNNER_TEMP/gh-cli"
          curl --fail --silent --show-error --location \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_CLI_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$binary_root"
          tar --extract --gzip --file "$archive" --directory "$binary_root" \
            --strip-components=2 "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          chmod 0755 "$binary_root/gh"
          echo "$binary_root" >> "$GITHUB_PATH"
          "$binary_root/gh" version

      - name: Create or refresh draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ROOT: ${{ runner.temp }}/prism-oss-release-bundle
        run: |
          assets=(
            "$RELEASE_ROOT/candidate/packages/useprism-sdk-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/packages/useprism-runtime-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/packages/useprism-provider-ollama-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/packages/useprism-cli-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/SHA256SUMS"
            "$RELEASE_ROOT/prism-0.1.0.spdx.json"
            "$RELEASE_ROOT/prism-0.1.0-licenses.json"
          )
          if release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
            if [[ "$release_state" == "true" ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            elif [[ "$release_state" != "false" ]]; then
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --verify-tag \
              --title "Prism $RELEASE_VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")"
          if [[ "$release_state" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --target "$GITHUB_SHA" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$release_state" != "false" ]]; then
            exit 1
          fi

      - name: Verify immutable GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ROOT: ${{ runner.temp }}/prism-oss-release-bundle
        run: |
          assets=(
            "$RELEASE_ROOT/candidate/packages/useprism-sdk-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/packages/useprism-runtime-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/packages/useprism-provider-ollama-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/packages/useprism-cli-0.1.0.tgz"
            "$RELEASE_ROOT/candidate/SHA256SUMS"
            "$RELEASE_ROOT/prism-0.1.0.spdx.json"
            "$RELEASE_ROOT/prism-0.1.0-licenses.json"
          )
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in "${assets[@]}"; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done

      # Bootstrap uses NPM_TOKEN for dist-tag mutation. Later tokenless OIDC
      # releases should use `npm stage publish` plus human approval because
      # OIDC does not authorize dist-tag mutation.
      - name: Promote closed npm set to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/promote-oss-release.mjs --version "$RELEASE_VERSION"
