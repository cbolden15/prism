  - id: PNH-INV-44
    title: Narrative prose is non-normative
    category: doctrine
    statement: |
      The constitution's narrative prose is explanatory and non-normative; on any conflict between narrative prose and a registered invariant statement, the registered statement binds.
    law_status: ratified
    proof_status: unproven
    proof_reason: Generated sections come from the registry, but no gate detects or resolves conflicting hand-written narrative prose.
