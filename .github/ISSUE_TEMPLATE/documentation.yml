name: Documentation problem
description: Report unclear, missing, stale, or incorrect Prism documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Include the page and the concrete task you were trying to complete. Do not include credentials, private run records, approval files, or provider output.
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link to the page or enter its repository path.
      placeholder: docs/developer-preview/getting-started.md
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: Describe the task and the point where the documentation stopped helping.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Quote only the smallest relevant phrase. Remove private data.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional wording, command, link, or diagram change.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Prism, Node.js, npm, and operating-system versions when the issue involves a command.
      placeholder: Prism 0.1.0, Node.js 26.8.1, npm 11.19.0, macOS arm64
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, private paths, run-record contents, approval data, and provider output.
          required: true
