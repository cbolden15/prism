  - id: PNH-INV-03
    title: Frames are bounded and fail closed
    category: plugin
    statement: |
      Every frame carries enforced bounds on frame bytes, cumulative bytes, message count, nesting depth, string bytes, array length, and object keys, with the values held in this registry; a frame that fails text decoding or violates any bound fails its allocation closed and is never repaired, coerced, or partially interpreted.
    law_status: ratified
    proof_status: proven
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: retain
      detail: rerun all parser boundaries
      closing_gates:
        - A
        - F
    bounds:
      max_frame_bytes: 1000000
      max_cumulative_bytes: 8000000
      max_message_count: 256
      max_json_depth: 16
      max_string_bytes: 65536
      max_array_length: 1024
      max_object_keys: 128
    conformance:
      - pnh/tests/protocol-bounds.test.ts
