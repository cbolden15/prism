  - id: PNH-INV-39
    title: Cell port is a message protocol
    category: plugin
    statement: |
      The plugin cell boundary is a versioned serialized message protocol pinned in this registry at introduction; moving cells out of process must not change admission tickets, capability grants, lifecycle receipts, or event semantics.
    law_status: ratified
    proof_status: unproven
    proof_reason: The current pins cover existing wire surfaces, but no out-of-process cell implementation proves semantic compatibility across a topology change.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: defer
      detail: no first-release conformance claim
      closing_gates:
        - H
    conformance: []
    since: 2026-08-21
    decisions:
      - docs/plans/provider-neutral-harness/2026-08-21-pnh-constitution-design.md
