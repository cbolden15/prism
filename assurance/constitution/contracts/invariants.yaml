  - id: PNH-INV-21
    title: Attribution comes from outside plugin bytes
    category: isolation
    statement: |
      Allocation identity is established outside plugin-controlled bytes before any output or failure is routed into a cell; attribution must never be derived from plugin payload content.
    law_status: ratified
    proof_status: unproven
    proof_reason: M3 rejects representative forged identities, but it does not yet cover every output and failure route or prove failure with attribution disabled.
