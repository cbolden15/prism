  - id: PNH-INV-24
    title: Physical splitting requires defeated-control evidence
    category: isolation
    statement: |
      Moving fault cells out of the shared trusted process is never legal without evidence that a specific attributed failure defeated a specific in-process control and that no smaller correction restores the bound.
    law_status: ratified
    proof_status: unproven
    proof_reason: M3 used a smaller correction successfully, but no enforceable review gate yet validates this evidence standard when a physical split is proposed.
    enforcement_kind: release-or-architecture-gate
