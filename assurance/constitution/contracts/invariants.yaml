  - id: PNH-INV-01
    title: Ordinary plugin faults stay inside their fault cell
    category: isolation
    statement: |
      An attributed ordinary failure of one plugin must not block, settle, or contaminate the work of any other plugin in the admitted set.
    law_status: ratified
    proof_status: unproven
    proof_reason: Representative fault-cell tests do not prove every ordinary failure class under the ratified deterministic scheduler model.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: activate
      closing_gates:
        - C
        - F
    conformance: []
