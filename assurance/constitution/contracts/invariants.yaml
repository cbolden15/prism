        kind: law-transition
        reason: Owner ratified the migrated invariant as constitutional law under the Plan A v1 baseline.
  - id: PNH-INV-40
    title: Bridges are ordinary admitted plugins
    category: bridge
    statement: |
      A foreign-capability bridge is an ordinary admitted plugin: containerized, capability-scoped, credential-free, and digest-bound by packaging the bridged server inside the plugin image.
    law_status: ratified
    proof_status: unproven
    proof_reason: No foreign-capability bridge implementation or production conformance path exists yet.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: defer
      detail: with D5
      closing_gates:
        - H
    conformance: []
    since: 2026-08-21
    decisions:
