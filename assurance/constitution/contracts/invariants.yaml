  - id: PNH-INV-05
    title: Policy admission gates grant derivation
    category: authority
    statement: |
      Policy admission must succeed before any non-Policy capability grant is derived, and explicit Policy denial, timeout, crash, malformed response, or protocol failure fails the task closed.
    law_status: ratified
    proof_status: unproven
    proof_reason: No production-path suite injects every named Policy failure before grant derivation and proves that each path denies all non-Policy grants.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: activate
      closing_gates:
        - B2
        - F
    conformance: []
