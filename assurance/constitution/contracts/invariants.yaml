  - id: PNH-INV-38
    title: Bounded cross-plugin interference
    category: isolation
    statement: Under legal registry-bounded load, every ready allocation receives one scheduler quantum before any ready allocation receives a second. One full rotation contains at most `max_live_allocations` turns, and each turn admits at most `max_commands_per_event_loop_turn` commands. All bounds live in this registry and tests import them. Wall-clock latency is not a universal invariant; any wall-clock claim requires a separately approved controlled performance qualification on a named environment.
    law_status: ratified
    proof_status: unproven
    proof_reason: Deterministic full-rotation fairness is not yet proven under every legal registry-bounded load.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: activate
      detail: after exact amendment
      closing_gates:
        - A
        - C
        - F
    bounds:
      max_live_allocations: 32
      max_live_allocations_per_plugin: 8
      max_concurrent_docker_invocations: 4
      max_command_bytes_per_allocation: 8000000
      max_command_ids_per_allocation: 4096
      max_tracked_command_allocations: 64
      max_recent_command_ids: 4096
      max_recent_acknowledged_allocations: 4096
      max_commands_per_event_loop_turn: 8
      max_wire_frame_bytes: 1000000
      max_wire_buffer_bytes: 8000000
    conformance:
      - pnh/tests/m3-aggregate-arbiter.test.ts
      - pnh/tests/m3-adversarial-isolation.test.ts
