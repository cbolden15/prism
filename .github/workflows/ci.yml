name: Prism CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Audit locked full dependency graph
        run: npm audit --audit-level=low --include=dev --include=optional --include=peer
      - name: Generate full dependency SBOM and enforce licenses
        env:
          SBOM_NAMESPACE: https://github.com/${{ github.repository }}/commit/${{ github.sha }}#sbom
        run: |
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/release/generate-oss-sbom.mjs \
            --root . \
            --output "$RUNNER_TEMP/prism-full.spdx.json" \
            --license-report "$RUNNER_TEMP/prism-full-licenses.json" \
            --created "$created" \
            --namespace "$SBOM_NAMESPACE"
      - run: npm test
      - run: npm run pack:check
