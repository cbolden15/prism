  - id: PNH-INV-06
    title: A request settles once
    category: evidence
    statement: |
      A request settles exactly once; duplicate or late observations arriving after settlement must never change the settled outcome.
    law_status: ratified
    proof_status: unproven
    proof_reason: No fault-injection suite covers duplicate and late observations across every request settlement path with the settlement guard disabled.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: activate
      closing_gates:
