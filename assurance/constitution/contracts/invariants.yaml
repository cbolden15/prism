  - id: PNH-INV-45
    title: Authenticated exchanges are replay-resistant
    category: evidence
    statement: |
      Every authenticated command, response, and receipt is replay-resistant; a replayed frame or receipt must never settle work, confer authority, or produce evidence.
    law_status: ratified
    proof_status: unproven
    proof_reason: Replay defenses are not proven across every authenticated command, response, and receipt path with the replay control disabled.
    enforcement_kind: runtime-adversarial
