        kind: law-transition
        reason: Owner ratified the migrated invariant as constitutional law under the Plan A v1 baseline.
  - id: PNH-INV-41
    title: Frozen foreign surface, default deny
    category: bridge
    statement: |
      The bridged foreign surface is enumerated at admission with schema hashes across every method family; any family or member not explicitly admitted is denied.
    law_status: ratified
    proof_status: unproven
    proof_reason: No bridge admission registry or fault-injection suite currently proves complete surface enumeration and default denial.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: defer
      detail: with D5
      closing_gates:
        - H
    conformance: []
