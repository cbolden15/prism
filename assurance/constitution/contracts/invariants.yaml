  - id: PNH-INV-07
    title: Post-dispatch uncertainty settles as ambiguous
    category: evidence
    statement: |
      Uncertainty about whether a dispatched effect occurred is recorded as ambiguous and must never be settled as success or as an ordinary failure.
    law_status: ratified
    proof_status: unproven
    proof_reason: No production-path test injects post-dispatch effect uncertainty and proves the outcome remains ambiguous rather than success or failure.
    enforcement_kind: runtime-adversarial
