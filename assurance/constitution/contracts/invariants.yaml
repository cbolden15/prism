  - id: PNH-INV-42
    title: Trusted mediation and attribution
    category: bridge
    statement: |
      Foreign-method dispatch is compared against the admitted surface and evidenced by a trusted harness-side mediator outside the plugin container; foreign-method evidence is never taken from the bridge's own claim, and a surface mismatch fails the plugin allocation closed with post-dispatch drift settling as ambiguous.
    law_status: ratified
    proof_status: unproven
    proof_reason: The trusted bridge mediator and its mismatch and post-dispatch ambiguity paths have not been implemented or adversarially tested.
    enforcement_kind: runtime-adversarial
    first_release:
      disposition: defer
      detail: with D5
      closing_gates:
        - H
