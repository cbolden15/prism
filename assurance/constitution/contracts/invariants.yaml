  - id: PNH-INV-09
    title: Proof runs production paths and injects the fault it names
    category: doctrine
    statement: |
      Conformance proof must exercise production constructors and protocol paths and must inject the fault it claims to prove; fixture-only parity, label-only cases, and skipped required suites never count as proof.
    law_status: ratified
    proof_status: unproven
    proof_reason: The gate verifies executed registrations, but it does not yet verify production-path use, fault injection, or failure when a control is disabled.
