  - id: PNH-INV-27
    title: Fixed boundary designation
    category: isolation
    statement: Every production execution class has one admission-bound authority boundary and one custody principal. `container-isolated-v1` uses the plugin container as its hostile-code boundary. `trusted-subprocess-v1` uses a dedicated restricted OS principal as its ambient-authority boundary but makes no hostile-code sandbox claim. The host custody daemon remains the sole lifecycle principal for both. `development-v1` is non-production.
    law_status: ratified
    proof_status: unproven
    proof_reason: No production proof establishes the exact authority boundary and custody principal for every execution class.
