  - id: PNH-INV-25
    title: Plugin code is assumed fully malicious
    category: isolation
    statement: Every admitted plugin executes under the execution class bound at admission. Code treated as hostile uses a separately constrained isolation class with production proof for its named boundary. Owner-reviewed subprocess code runs only under the restricted Prism execution principal, is never described as sandboxed, and receives no user, broker, operator, or publisher authority. Development code cannot produce production evidence or privileged effects.
    law_status: ratified
    proof_status: unproven
    proof_reason: No production proof covers every admitted execution class, including hostile container isolation, restricted trusted subprocess authority, and development-mode exclusion.
    enforcement_kind: runtime-adversarial
